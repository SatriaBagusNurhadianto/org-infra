# SPDX-License-Identifier: Apache-2.0
#
# Temporary manual diagnostic to identify PROJECT_SYNC_TOKEN and optionally
# revoke it without exposing its value. Remove after the investigation.

name: Identify and retire project token

on:
  workflow_dispatch:
    inputs:
      revoke:
        description: 'Irreversibly revoke PROJECT_SYNC_TOKEN after identifying its owner'
        required: false
        type: boolean
        default: false

# Serialize diagnostics and revocation so they cannot race each other.
concurrency:
  group: sync-compliance-automation-project-board
  cancel-in-progress: false

permissions: {}

jobs:
  diagnose-project-token:
    name: Identify project token (optionally revoke)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Identify credential and optionally revoke
        shell: python3 {0}
        env:
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          REVOKE: ${{ inputs.revoke }}
        run: |
          # SPDX-License-Identifier: Apache-2.0
          import json
          import os
          import urllib.error
          import urllib.request
          from typing import Optional, Tuple

          API_URL = "https://api.github.com"
          REQUEST_TIMEOUT = 30
          TOKEN_TYPES = {
              "github_pat_": "Fine-grained personal access token",
              "ghp_": "Classic personal access token",
              "gho_": "OAuth access token",
              "ghu_": "GitHub App user access token",
              "ghs_": "GitHub App installation access token",
              "ghr_": "GitHub App refresh token",
          }
          REVOCABLE_PREFIXES = ("github_pat_", "ghp_", "gho_", "ghu_", "ghr_")


          def request(
              path: str, *, authenticate: bool = True, payload: Optional[dict] = None
          ) -> Tuple[int, bytes]:
              headers = {
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if authenticate:
                  headers["Authorization"] = f"Bearer {token}"
              body = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  body = json.dumps(payload).encode()
              api_request = urllib.request.Request(f"{API_URL}{path}", data=body, headers=headers)
              try:
                  with urllib.request.urlopen(api_request, timeout=REQUEST_TIMEOUT) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  # Never log response bodies, headers, or exception details.
                  with error:
                      return error.code, b""
              except OSError:
                  raise SystemExit("::error::GitHub request failed; details suppressed")


          token = os.environ.get("PROJECT_SYNC_TOKEN", "")
          if not token:
              raise SystemExit("::error::PROJECT_SYNC_TOKEN is not configured")
          token_type = next(
              (label for prefix, label in TOKEN_TYPES.items() if token.startswith(prefix)),
              "Unknown credential format",
          )
          print(f"Credential type: {token_type}", flush=True)
          status, body = request("/user")
          if status != 200:
              raise SystemExit(
                  f"::error::Identity lookup returned HTTP {status}; owner unconfirmed; not revoking"
              )
          try:
              identity = json.loads(body)
              login, account_id = identity["login"], identity["id"]
              if not isinstance(login, str) or type(account_id) is not int:
                  raise ValueError
          except (ValueError, KeyError, TypeError):
              raise SystemExit("::error::Invalid identity response; not revoking")
          print(f"Authenticated account: {json.dumps(login)}; account ID: {account_id}", flush=True)

          if os.environ.get("REVOKE", "false").lower() == "true":
              if not token.startswith(REVOCABLE_PREFIXES):
                  raise SystemExit("::error::Credential format is not supported for revocation")
              # This endpoint requires NO Authorization header, even for our token.
              status, _ = request(
                  "/credentials/revoke", authenticate=False, payload={"credentials": [token]}
              )
              if status != 202:
                  raise SystemExit(f"::error::Revocation request returned HTTP {status}")
              status, _ = request("/user")
              if status != 401:
                  raise SystemExit(
                      f"::error::Revocation accepted but NOT confirmed (HTTP {status}); "
                      "run the diagnostic again to check authentication"
                  )
              print("Revocation confirmed: credential now returns HTTP 401.")
          else:
              print("Read-only diagnostic complete; no revocation requested.")
